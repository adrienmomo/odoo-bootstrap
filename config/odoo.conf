[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password_file = /run/secrets/postgresql_password

; Data directory
data_dir = /var/lib/odoo

; Session directory
session_dir = /var/lib/odoo/sessions

; Log settings
log_level = info
log_handler = :INFO

; Server settings
xmlrpc_port = 8069
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 2